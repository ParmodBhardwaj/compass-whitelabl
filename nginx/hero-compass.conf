# ============================================================================
# Nginx reverse-proxy configuration — Hero Compass
# Strangler Pattern: legacy PHP app on port 80 (Apache), new Node on ports
#   3000 (Next.js)  and  4000 (NestJS API).
#
# Deployment strategy:
#   1. Keep existing Apache/PHP running on 127.0.0.1:8080 (or :8000).
#   2. Nginx listens on :80 (and :443 with TLS).
#   3. Routes /v2/* → NestJS API.
#   4. Routes /* (portal pages) → Next.js.
#   5. Cut over module-by-module by updating location blocks.
#      After each module is signed off, the legacy location block for that
#      module is commented out — Next.js takes over from Nginx.
#   6. Static uploads (/files/) served directly from storage root.
#
# Once ALL modules are cut over, remove the @legacy block entirely and
# decommission Apache.
# ============================================================================

upstream hero_api {
    # NestJS API — PM2 cluster (2 instances on same port)
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream hero_web {
    # Next.js — single process (fork mode)
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream hero_legacy {
    # Legacy Apache/PHP — keep running on non-standard port during migration
    server 127.0.0.1:8080;
    keepalive 16;
}

# ── HTTP → HTTPS redirect (uncomment after TLS cert is configured) ──────────
# server {
#     listen 80;
#     server_name compass.heromotocorp.com;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ────────────────────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;     # uncomment for TLS
    server_name compass.heromotocorp.com localhost;

    # ssl_certificate     /etc/ssl/hero/fullchain.pem;
    # ssl_certificate_key /etc/ssl/hero/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    # ── Static file storage (NestJS uploads) ────────────────────────────────
    location /files/ {
        alias /var/hero/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Legacy PHP static assets (JS/CSS/images from existing portal) ───────
    location /legacy/ {
        proxy_pass http://hero_legacy/;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }

    # ── NestJS REST API ──────────────────────────────────────────────────────
    location /v2/ {
        proxy_pass http://hero_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Next.js HMR / webpack dev server (dev only, remove in prod) ─────────
    location /_next/webpack-hmr {
        proxy_pass http://hero_web/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Next.js static assets ────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://hero_web/_next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Portal + admin pages (fully migrated — served by Next.js) ───────────
    #
    # As each legacy module is cut over, add its path here and remove (or
    # comment out) the corresponding @legacy proxy_pass block below.
    #
    # Waves 0–4 are complete; all portal & admin routes go to Next.js:
    location /portal/ {
        proxy_pass http://hero_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://hero_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://hero_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Catch-all: during strangler phase, unknown routes go to legacy ───────
    # Once migration is complete, change this to proxy to hero_web.
    location / {
        # Phase: strangler — unknown routes still served by legacy PHP
        proxy_pass http://hero_legacy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Post-migration (comment out above, uncomment below) ──────────────
        # proxy_pass http://hero_web;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/hero-compass-access.log;
    error_log  /var/log/nginx/hero-compass-error.log warn;
}
